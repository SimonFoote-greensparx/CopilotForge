# Generated by scripts/build-bundles.py. Do not edit by hand.
# Deterministic tailoring rules used by scripts/tailor.py and bundled with the organisation-tailoring skills.
# These are proposed CopilotForge conventions (decisions D12 and D13), not Microsoft classifications. Every rule has an
# id so a recommendation can say which rule produced it. Change a rule here, then run bash scripts/build-all.sh: the
# golden-output tests in evaluations/golden/ show exactly which sample recommendations moved.
version: 1

edition_rules:
  # Evaluated in order; the first rule whose conditions all hold wins.
  - id: E1-enterprise-size
    edition: enterprise
    any_of:
      - {field: people.workforce_size, op: ">=", value: 2500}
      - {field: organisation.business_units, op: ">=", value: 4}
    rationale: "A workforce of 2,500 or more, or four or more business units, needs federated governance, formal assurance and portfolio management."
  - id: E2-starter-size
    edition: starter
    all_of:
      - {field: people.workforce_size, op: "<", value: 250}
      - {field: organisation.business_units, op: "<=", value: 1}
      - {field: organisation.regulatory_context.level, op: "!=", value: high}
    rationale: "Fewer than 250 people in a single business unit without high regulatory expectations can run a light, owner-led programme."
  - id: E3-scale-default
    edition: scale
    all_of: []
    rationale: "Between Starter and Enterprise. Repeatable intake, Champions, agent ownership and formal measures are worth their overhead."

assurance_overlay_rules:
  - id: A1-formal-assurance
    overlay: formal
    any_of:
      - {field: organisation.regulatory_context.level, op: "==", value: high}
    rationale: "A regulator expects auditable approval gates, so reviewer evidence is recorded formally whatever the edition."
  - id: A2-proportionate-assurance
    overlay: proportionate
    all_of: []
    rationale: "Controls rise with risk tier, reach, data sensitivity and autonomy (progressive governance)."

# Archetype diagnosis: the archetype is the earliest stage whose exit is not yet met, so an organisation is never
# placed beyond a foundation it has skipped. Signals of later stages are reported separately as emerging signals.
archetype_rules:
  - id: R1-explorer
    archetype: explorer
    any_of:
      - {field: microsoft_estate.copilot.usage_pattern, op: in, value: [none, pilot]}
    rationale: "Little formal AI adoption yet. Copilot is absent or confined to a pilot."
  - id: R2-adopter
    archetype: adopter
    any_of:
      - {field: microsoft_estate.copilot.usage_pattern, op: "==", value: inconsistent}
      - {field: adoption.champions, op: "==", value: none}
    rationale: "Copilot is deployed but use is inconsistent or unsupported by a Champion community, so adoption is the binding constraint."
  - id: R3-builder
    archetype: builder
    any_of:
      - {field: governance.coe, op: "!=", value: established}
      - {field: organisation.business_units, op: "<", value: 2}
    rationale: "Adoption is consistent and agents or automation are appearing, but there is not yet a multi-unit portfolio under an established CoE."
  - id: R4-scaler
    archetype: scaler
    any_of:
      - {field: portfolio.custom_ai_in_production, op: "!=", value: true}
      - {field: portfolio.portfolio_managed, op: "!=", value: true}
    rationale: "Several business units own solutions under an established CoE, but custom AI in production or portfolio management is not yet in place."
  - id: R5-ai-enterprise
    archetype: ai-enterprise
    all_of: []
    rationale: "AI is an established strategic capability with a managed portfolio and custom AI in production."

signal_rules:
  - id: S1-agents-emerging
    signal: agents-emerging
    any_of:
      - {field: ai_usage.current_agents, op: ">", value: 0}
      - {field: portfolio.live_agents, op: ">", value: 0}
    note: "Staff are already building agents, so an agent intake and lifecycle route is needed now, not later."
  - id: S2-shadow-ai
    signal: shadow-ai
    any_of:
      - {field: ai_usage.shadow_ai, op: in, value: [suspected, known]}
    note: "Unsanctioned AI use is suspected or known, so an approved-use starter and safe alternatives come first."
  - id: S3-coe-requested
    signal: coe-requested
    any_of:
      - {field: governance.coe, op: in, value: [forming, established]}
      - {field: organisation.ai_ambition, op: in, value: [scale, transform]}
    note: "Leadership wants a Centre of Excellence or an ambition that needs one."
  - id: S4-no-ai-policy
    signal: no-ai-policy
    any_of:
      - {field: governance.ai_policy, op: "==", value: none}
    note: "There is no approved AI acceptable-use policy."
  - id: S5-weak-knowledge
    signal: weak-knowledge
    any_of:
      - {field: knowledge.ownership_model, op: in, value: [none, partial]}
      - {field: knowledge.quality, op: in, value: [none, low]}
    note: "Knowledge ownership or quality is weak, so agents grounded on it will be unreliable until it is fixed."
