# Golden tailoring plan. Regenerate with python3 scripts/check-profiles.py --update after review.
profile: profiles/samples/ashby-studio-starter.yaml
organisation: Ashby Studio (fictional)
fictional: true
edition:
  id: starter
  rule: E2-starter-size
  rationale: Fewer than 250 people in a single business unit without high regulatory expectations can run a light, owner-led
    programme.
  coe_form: An AI working group of three to five people meeting monthly, with the sponsor attending quarterly.
  champions_form: An informal network of volunteers with a light evidence route.
  governance_form: An acceptable-use starter, a named owner for anything shared, and reviewer gates only from risk tier 2.
assurance_overlay:
  id: proportionate
  rule: A2-proportionate-assurance
  rationale: Controls rise with risk tier, reach, data sensitivity and autonomy (progressive governance).
archetype:
  id: adopter
  rule: R2-adopter
  rationale: Copilot is deployed but use is inconsistent or unsupported by a Champion community, so adoption is the binding
    constraint.
  output_emphasis: Personas, Champions, role-based learning, adoption measures and repeatable scenarios.
emerging_signals:
- signal: shadow-ai
  rule: S2-shadow-ai
  note: Unsanctioned AI use is suspected or known, so an approved-use starter and safe alternatives come first.
- signal: no-ai-policy
  rule: S4-no-ai-policy
  note: There is no approved AI acceptable-use policy.
