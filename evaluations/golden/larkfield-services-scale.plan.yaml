# Golden tailoring plan. Regenerate with python3 scripts/check-profiles.py --update after review.
profile: profiles/samples/larkfield-services-scale.yaml
organisation: Larkfield Services (fictional)
fictional: true
edition:
  id: scale
  rule: E3-scale-default
  rationale: Between Starter and Enterprise. Repeatable intake, Champions, agent ownership and formal measures are worth their
    overhead.
  coe_form: A small core CoE team with business representatives and a monthly steering cadence.
  champions_form: A formal, evidence-led Champions programme with challenges and recognition.
  governance_form: Risk-tiered intake, a solution register and reviewer gates from risk tier 2, with security and privacy
    review blocking release.
assurance_overlay:
  id: proportionate
  rule: A2-proportionate-assurance
  rationale: Controls rise with risk tier, reach, data sensitivity and autonomy (progressive governance).
archetype:
  id: adopter
  rule: R2-adopter
  rationale: Copilot is deployed but use is inconsistent or unsupported by a Champion community, so adoption is the binding
    constraint.
  output_emphasis: Personas, Champions, role-based learning, adoption measures and repeatable scenarios.
emerging_signals:
- signal: agents-emerging
  rule: S1-agents-emerging
  note: Staff are already building agents, so an agent intake and lifecycle route is needed now, not later.
- signal: shadow-ai
  rule: S2-shadow-ai
  note: Unsanctioned AI use is suspected or known, so an approved-use starter and safe alternatives come first.
- signal: coe-requested
  rule: S3-coe-requested
  note: Leadership wants a Centre of Excellence or an ambition that needs one.
- signal: weak-knowledge
  rule: S5-weak-knowledge
  note: Knowledge ownership or quality is weak, so agents grounded on it will be unreliable until it is fixed.
