# Cross-department acceptance scenario (design brief section 10.2). Checked by scripts/check-refs.py.
id: we-need-an-ai-coe
prompt: "We need an AI Centre of Excellence."
route: [ai-centre-of-excellence, ai-strategy, platform-governance, opportunity-management, value-realisation]
skeleton_skills:
  - ai-centre-of-excellence:coe-charter
  - ai-centre-of-excellence:coe-operating-model
  - ai-centre-of-excellence:coe-raci
  - ai-centre-of-excellence:coe-governance-model
