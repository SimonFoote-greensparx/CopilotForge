# The department catalogue: the single source of truth for every department's metadata.
# scripts/build-port.py emits plugin manifests and department READMEs from this file, and scripts/build-catalogue.py
# emits the README tables, docs/CATALOGUE.md and catalogue/catalogue.json. Edit this file, then run
# bash scripts/build-all.sh. Never hand-edit the generated files.
#
# layer:            transformation | adoption | delivery | assurance | spanning  (design brief section 3)
# reviewer:         true for reviewer-class departments, which may block (design brief section 7.1). They live under reviewers/.
# status:           active (has a folder and skills) | planned (catalogued, not yet built)
# journey:          strategy | adopt | build | govern | scale | measure (design brief 15.2, the website's capability map)
# phase:            the roadmap phase in which the department is built (docs/ROADMAP.md)
# candidate_skills: the brief's candidate list. Built skills may use a distinct name where the candidate would clash
#                   with another CopilotForge skill or with a D365Forge skill (decision D9).

