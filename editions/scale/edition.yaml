id: scale
title: Scale
typical_context: Mid-sized organisation, or adoption expanding beyond pilots.
design_emphasis: Champions, repeatable intake, agent ownership, platform governance, portfolio visibility and formal measures.
coe_form: A small core CoE team with business representatives and a monthly steering cadence.
champions_form: A formal, evidence-led Champions programme with challenges and recognition.
governance_form: Risk-tiered intake, a solution register and reviewer gates from risk tier 2, with security and privacy review blocking release.
depth_default: standard
